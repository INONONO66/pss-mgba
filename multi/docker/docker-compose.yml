name: pss-mgba

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - ADMIN_TOKEN=${ADMIN_TOKEN:-dev-admin-token}
      - MAX_INSTANCES=${MAX_INSTANCES:-10}
      - ROM_PATH=${ROM_PATH:-/rom/game.gb}
      - BASE_LUA_PORT=${BASE_LUA_PORT:-8888}
      - LUA_SCRIPT_PATH=/app/mGBASocketServer.lua
      - FRAME_DIR=/tmp/frames
    volumes:
      - ${ROM_PATH:-.}/roms:/rom:ro
    tmpfs:
      - /tmp/frames:size=256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>{process.exit(r.ok?0:1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
